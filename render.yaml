services:
  - type: web
    name: synthetic-data-platform
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: |
      cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.17.0
